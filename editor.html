<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊びの設計室 | Course Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#203e40;font-family:'Yu Gothic UI',Meiryo,sans-serif}main{max-width:1180px;margin:auto;padding:30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.tag{font-size:12px;letter-spacing:.13em;color:#477568}h1{font-size:30px;margin:8px 0}p{line-height:1.8}.pill{padding:9px 15px;background:#e1eadf;border-radius:25px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px}.board,aside{background:#fffefa;border:1px solid #dedfd3;border-radius:20px;padding:20px}.board p{font-size:13px;margin:0 0 15px}svg{display:block;width:100%;touch-action:none;background:#eaf0e6;border-radius:12px}.block{cursor:grab;outline:none}.block:focus rect{stroke:#182f31;stroke-width:.08}.block text{pointer-events:none;font-size:.18px;fill:white;font-weight:bold}.block:active{cursor:grabbing}h2{font-size:18px;margin:0 0 16px}.row{padding:15px 0;border-bottom:1px solid #e7e8df;font-size:14px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}.value{float:right;color:#536662}.hint{font-size:13px;color:#5e716c}button{font:inherit;border:0;border-radius:11px;padding:13px 16px;cursor:pointer;width:100%;margin-top:10px;background:#e9eee5;color:#28433e}button.primary{background:#226452;color:white}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){filter:brightness(.95)}#status{padding:12px;border-radius:10px;background:#eef3e9;min-height:72px;font-size:13px;line-height:1.7;margin-top:16px}.error{color:#a13222!important;background:#fff0e8!important}.footer{font-size:13px;color:#5e716c;margin-top:18px}#undo{margin-top:0}@media(max-width:850px){main{padding:15px}.layout{grid-template-columns:1fr}header{align-items:flex-start}.pill{display:none}}
</style>
<main>
<header><div><div class="tag">COURSE BUILDER / DESIGN STUDIO</div><h1>遊びの設計室</h1><div>箱を置いて、作ってほしい形を伝えよう。</div></div><span class="pill">STEP 1 · 完成形を設計</span></header>
<div class="layout"><section class="board"><p>真上から見た設計図 · 箱をドラッグ · 25cmずつ移動 · 向きは固定</p>
<svg id="canvas" viewBox="-1.65 -3.65 6.3 7.3" role="group" aria-label="箱2個の配置エリア">
<defs><pattern id="grid" width=".25" height=".25" patternUnits="userSpaceOnUse"><path d="M .25 0 L 0 0 0 .25" fill="none" stroke="#becfbd" stroke-width=".012"/></pattern></defs>
<rect x="-1.22" y="-3.24" width="5.44" height="6.48" fill="url(#grid)" stroke="#a1b79e" stroke-width=".025"/>
<text x="-1.15" y="-3.4" font-size=".15" fill="#58735e">完成形の配置エリア　5.5 × 6.5 m</text>
<path d="M -.8 2.8 h .6 m -.15 -.1 l .15 .1 -.15 .1" fill="none" stroke="#6b8271" stroke-width=".025"/>
<text x="-.8" y="3.08" font-size=".14" fill="#58735e">車両の進む向き →</text>
<g class="block" id="block_1" tabindex="0" role="button" aria-label="赤い箱。矢印キーでも移動できます"><rect x="-.22" y="-.24" width=".44" height=".48" rx=".035" fill="#dd6653"/><text text-anchor="middle" dy=".065">1</text></g>
<g class="block" id="block_2" tabindex="0" role="button" aria-label="青い箱。矢印キーでも移動できます"><rect x="-.22" y="-.24" width=".44" height=".48" rx=".035" fill="#4783ae"/><text text-anchor="middle" dy=".065">2</text></g>
</svg><div class="footer">箱を選んで矢印キーでも移動できます。箱の大きさは44 × 48cm。図面の上が＋Y、右が＋Xです。</div></section>
<aside><h2>小さな門をつくる</h2><p class="hint">赤と青の箱を離して、その間にボールが通る場所を作ってみよう。</p>
<div class="row"><span class="dot" style="background:#dd6653"></span>赤い箱 <span id="pos1" class="value"></span></div>
<div class="row"><span class="dot" style="background:#4783ae"></span>青い箱 <span id="pos2" class="value"></span></div>
<p id="gap" class="hint"></p><button id="undo">ひとつ戻す</button><button id="reset">門の配置に戻す</button><button id="save" class="primary">この配置を保存</button><button id="preview">保存して3Dで見る</button>
<div id="status" role="status" aria-live="polite">配置を読み込んでいます…</div>
<p class="hint">3Dは完成形のプレビューです。車両が組み立てた結果ではありません。自動施工・AIの命名は次の段階で追加します。</p></aside></div>
</main>
<script>
const initial=()=>({schema:1,blocks:[{id:'block_1',x:1.5,y:.75,yaw:0},{id:'block_2',x:1.5,y:-.75,yaw:0}]});
let model=initial(),history=[],drag=null,busy=false;
const svg=document.querySelector('#canvas'),status=document.querySelector('#status');
function message(text,error=false){status.textContent=text;status.classList.toggle('error',error)}
function invalid(){const [a,b]=model.blocks;return Math.abs(a.x-b.x)<.44&&Math.abs(a.y-b.y)<.48}
function remember(){history.push(JSON.stringify(model));if(history.length>50)history.shift()}
function draw(){model.blocks.forEach((b,i)=>{document.getElementById(b.id).setAttribute('transform',`translate(${b.x} ${-b.y})`);document.getElementById('pos'+(i+1)).textContent=`${b.x.toFixed(2)}, ${b.y.toFixed(2)} m`});const [a,b]=model.blocks;document.querySelector('#gap').textContent=a.x===b.x?`上下の箱のすき間：${Math.max(0,Math.abs(a.y-b.y)-.48).toFixed(2)} m（ボールの直径は0.40 m）`:'箱のX位置をそろえると、まっすぐな門になります。';document.querySelector('#undo').disabled=!history.length||busy;for(const id of ['save','preview'])document.getElementById(id).disabled=busy||invalid();if(invalid())message('箱が重なっています。少し離して置いてね。',true)}
function move(b,x,y){b.x=Math.max(-1,Math.min(4,Math.round(x*4)/4));b.y=Math.max(-3,Math.min(3,Math.round(y*4)/4));message('配置を変更しました。保存すると次回も開けます。');draw()}
function point(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return {x:p.x,y:-p.y}}
for(const b of model.blocks){const el=document.getElementById(b.id);el.addEventListener('pointerdown',e=>{if(busy)return;const block=model.blocks.find(x=>x.id===el.id),p=point(e);remember();drag={id:el.id,dx:block.x-p.x,dy:block.y-p.y};el.setPointerCapture(e.pointerId);el.focus();e.preventDefault()});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==el.id)return;const p=point(e);move(model.blocks.find(x=>x.id===el.id),p.x+drag.dx,p.y+drag.dy)});el.addEventListener('pointerup',()=>{drag=null;draw()});el.addEventListener('pointercancel',()=>{drag=null;draw()});el.addEventListener('keydown',e=>{const d={ArrowLeft:[-.25,0],ArrowRight:[.25,0],ArrowUp:[0,.25],ArrowDown:[0,-.25]}[e.key];if(!d||busy)return;e.preventDefault();remember();const b=model.blocks.find(x=>x.id===el.id);move(b,b.x+d[0],b.y+d[1])})}
document.querySelector('#undo').onclick=()=>{if(history.length){model=JSON.parse(history.pop());message('ひとつ前の配置に戻しました。');draw()}};
document.querySelector('#reset').onclick=()=>{if(busy)return;remember();model=initial();message('門の配置に戻しました。保存はまだしていません。');draw()};
async function save(preview){if(busy||invalid())return;busy=true;draw();try{const r=await fetch(preview?'/api/preview':'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(model)});const data=await r.json();if(!r.ok)throw Error(data.error);message(preview?'保存しました。別ウィンドウで3Dプレビューを開きます。':'保存できました。次回はこの配置から始められます。')}catch(e){message(e.message,true)}finally{busy=false;draw()}}
document.querySelector('#save').onclick=()=>save(false);document.querySelector('#preview').onclick=()=>save(true);
fetch('/api/layout').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{model=data;message('箱をドラッグして、作りたい形に並べてね。');draw()}).catch(()=>{message('読み込めませんでした。設計室を起動し直してください。',true)});draw();
</script></html>
